[project]
name = "verifiers"
authors = [
    {name = "William Brown", email = "williambrown97@gmail.com"},
    {name = "Alex Andonian", email = "alexandonian@gmail.com"},
]
version = "0.1.0"
description = "Verifiers for reinforcement learning with LLMs"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "setuptools",
    "deepspeed",
    "accelerate",
    "peft",
    "wandb",
    "rich",
    "duckduckgo-search",
    "trl==0.16.0",
    "liger-kernel",
    "brave-search",
    "latex2sympy>=1.0.3",
    "math-verify[antlr4-13-2]>=0.1.0",
    "pylatexenc>=2.10",
    "requests>=2.32.3",
    "scipy>=1.15.2",
    "aiopyston>=1.2.1",
    "transformers>=4.51.0",
    "vllm>=0.8.5",
]

[tool.setuptools]
packages = ["verifiers"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
]
